spring.application.name=shop
spring.datasource.url=jdbc:postgresql://localhost:5432/shop_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

jwt.private-key=classpath:keys/jwt-private.pem
jwt.public-key=classpath:keys/jwt-public.pem

# single-location (default) | most-abundant
shop.location-strategy=single-location

shop.time-zone=

shop.revenue.enabled=true
shop.revenue.cron=0 5 0 * * *

spring.task.scheduling.pool.size=1
spring.task.scheduling.thread-name-prefix=shop-scheduler-
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s
